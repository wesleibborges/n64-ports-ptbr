# Config file for Body Harvest (US) static recompilation.
# Gerado a partir do build byte-perfect do decompilacao jaytheham/body-harvest-decompilation.

[input]
entrypoint = 0x80000400
# Caminhos relativos a este arquivo.
elf_path = "build/bh.us.elf"
rom_file_path = "baserom.us.z64"
output_func_path = "RecompiledFuncs"
bss_section_suffix = "_bss"
relocatable_sections_path = "relocatable_sections.txt"
# Chamadas de funcao resolvidas em runtime (lookup) — necessario para jal entre overlays,
# pois o ELF final do decomp nao possui tabelas de relokocacao.
use_lookup_for_all_function_calls = true
